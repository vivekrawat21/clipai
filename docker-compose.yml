services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: clip-ai-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: clipai
      POSTGRES_PASSWORD: clipai_password
      POSTGRES_DB: clip_ai

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
    
  redis:
    image: redis:7-alpine
    container_name: clip-ai-redis
    restart: unless-stopped
    ports:
      - "6380:6379"

  flower:
    image: mher/flower:2.0.1
    container_name: clip-ai-flower
    restart: unless-stopped
    command: celery --broker=redis://redis:6379/0 flower --port=5555
    environment:
      TZ: UTC
    depends_on:
      - redis
    ports:
      - "5555:5555"

volumes:
  postgres_data:

