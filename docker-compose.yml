services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: clip-ai-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: clipai
      POSTGRES_PASSWORD: clipai_password
      POSTGRES_DB: clip_ai

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
    
  redis:
    image: redis:7-alpine
    container_name: clip-ai-redis
    restart: unless-stopped
    ports:
      - "6380:6379"

volumes:
  postgres_data:

